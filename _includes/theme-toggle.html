<div class="theme-toggle" role="group" aria-label="Color theme">
  <button type="button" class="theme-btn" data-theme="light" aria-label="Light theme" aria-pressed="true" title="Light">
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <rect x="6" y="0" width="2" height="2"/>
      <rect x="4" y="2" width="6" height="2"/>
      <rect x="2" y="4" width="10" height="2"/>
      <rect x="0" y="6" width="2" height="2"/>
      <rect x="2" y="6" width="10" height="2"/>
      <rect x="12" y="6" width="2" height="2"/>
      <rect x="2" y="8" width="10" height="2"/>
      <rect x="4" y="10" width="6" height="2"/>
      <rect x="6" y="12" width="2" height="2"/>
    </svg>
    <span class="theme-btn-label" aria-hidden="true">Day</span>
  </button>
  <button type="button" class="theme-btn" data-theme="dusk" aria-label="Dusk theme" aria-pressed="false" title="Dusk">
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <rect x="4" y="2" width="6" height="2"/>
      <rect x="2" y="4" width="10" height="2"/>
      <rect x="0" y="8" width="14" height="2"/>
    </svg>
    <span class="theme-btn-label" aria-hidden="true">Dusk</span>
  </button>
  <button type="button" class="theme-btn" data-theme="dark" aria-label="Dark theme" aria-pressed="false" title="Dark">
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <rect x="6" y="0" width="2" height="2"/>
      <rect x="6" y="2" width="2" height="2"/>
      <rect x="4" y="4" width="6" height="2"/>
      <rect x="0" y="6" width="14" height="2"/>
      <rect x="4" y="8" width="6" height="2"/>
      <rect x="6" y="10" width="2" height="2"/>
      <rect x="6" y="12" width="2" height="2"/>
    </svg>
    <span class="theme-btn-label" aria-hidden="true">Night</span>
  </button>
</div>
