<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>{{ page.title }}</title>
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=yes">
		<meta name="theme-color" content="#f3f2fb">
		<script>
		  (function () {
		    window.__THEME_COLORS = { light: "#f3f2fb", dusk: "#e0cde9", dark: "#140f26" };
		    try {
		      var theme = localStorage.getItem("theme") || "light";
		      document.documentElement.setAttribute("data-theme", theme);
		      var meta = document.querySelector('meta[name="theme-color"]');
		      if (meta) meta.setAttribute("content", window.__THEME_COLORS[theme] || window.__THEME_COLORS.light);
		    } catch (e) {}
		  })();
		</script>
		<link rel="stylesheet" href="css/style.css">
		<link href='https://fonts.googleapis.com/css?family=VT323' rel='stylesheet' type='text/css'>
		<meta name="description" content="Ryan Petersen's personal website.">
		<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
	</head>

	<body>
		<header>
			<div class="overlay"></div>
			{% include roadblasters.html %}
			{% include theme-toggle.html %}
			<div class="logo">
				<a class="github-logo" href="https://github.com/rpetersen29" target="_blank" rel="noopener"></a>
			<span>Ryan Petersen</span>
		</div>
		</header>

		<div class="main-container">
			{{ content }}

		</div>
		<script src="js/theme.js"></script>
	</body>

</html>
